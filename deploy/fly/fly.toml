# Brewlab online demo on Fly.io — see docs/DEMO.md.
#   fly launch --no-deploy --copy-config -c deploy/fly/fly.toml --name <your-app-name>
#   fly deploy -c deploy/fly/fly.toml --ha=false
# One machine, always on: each visitor's copy lives in that machine's memory, so a second machine
# (or one that stops when idle) would hand visitors an empty-handed reset.

app = "brewlab-demo" # change to a name of your own
primary_region = "iad"

[build]
  image = "ghcr.io/cmerkle/brewlab:latest" # the published image; DEMO=1 below turns it into the demo

[env]
  DEMO = "1"
  DEMO_IDLE_MIN = "60"       # a visitor's copy is dropped after this long idle
  DEMO_MAX_SANDBOXES = "300" # ~0.35 MB each; the oldest idle copy goes first when full
  DEMO_NEW_PER_IP = "30"     # new copies per address per hour
  TZ = "UTC"

[http_service]
  internal_port = 7642
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
