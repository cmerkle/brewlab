<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12100e" />
    <script>
      // Dark unless this device picked light (More → Settings → Appearance); set before the first paint.
      (function () {
        var t = "dark";
        try { if (JSON.parse(localStorage.getItem("brewlab.theme")) === "light") t = "light"; } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f5f0ea" : "#12100e";
      })();
    </script>
    <meta name="description" content="Brew recipes, grind guide, coffee stash and weekly picks." />
    <title>Brewlab</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <!-- iOS: home-screen icon and full-screen standalone launch -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Brewlab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
